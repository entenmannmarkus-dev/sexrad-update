<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SexRad">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SexRad</title>
<!--
  SEXRAD – lokale Glücksrad-App (eine Datei, offline).
  Installation als App (Vollbild ohne Browserleiste):
   • Android/Samsung (Chrome oder Samsung Internet): Seite öffnen → Menü ⋮ → „App installieren“
     bzw. „Zum Startbildschirm hinzufügen“. Danach über das Symbol starten.
   • iOS/iPadOS (Safari): Teilen → „Zum Home-Bildschirm“.
   Echte Installation (Vollbild, Offline-Cache) klappt nur, wenn die Dateien über https geladen werden
   (z. B. GitHub Pages / Netlify Drop). Über file:// läuft die App auch, aber als normaler Browser-Tab.
   Alle Felder liegen in localStorage, Fotos/Videos in IndexedDB – nur auf diesem Gerät.
-->
<style>
  :root{
    --bg:#050505; --rail:132px;
    --cream:#ecdfc2; --red:#6a1016; --bronze:#a8844e; --metal1:#3c3c40; --metal2:#141416;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit}

  /* ---------- Bühne mit den Rädern (volle Höhe, kein Rand) ---------- */
  #stage{position:fixed;left:0;top:0;bottom:0;right:var(--rail)}
  #cv{width:100%;height:100%;display:block}

  /* ---------- Rechte Leiste: Aktions-Buttons mittig rechts ---------- */
  #rail{position:fixed;right:0;top:0;bottom:0;width:var(--rail);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding-right:env(safe-area-inset-right)}
  .spin{width:112px;height:112px;border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#d0343a 0,#8a1219 42%,#3d0408 100%);
    border:7px solid #232326;
    box-shadow:0 0 0 2px #6d5531,inset 0 4px 10px rgba(255,255,255,.25),inset 0 -8px 14px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.8);
    color:#f6e8c6;font-weight:800;font-size:17px;letter-spacing:1px;text-shadow:0 2px 0 #2a0204}
  .spin:active{transform:scale(.96)}
  .mbtn{width:112px;padding:11px 0;border-radius:12px;border:1px solid #4a4a4e;
    background:linear-gradient(#3b3b3f,#141416);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.7);
    color:var(--cream);font-weight:700;font-size:14px;letter-spacing:.5px}
  .mbtn.gold{color:#f2c45a;text-shadow:0 0 8px rgba(242,196,90,.5)}
  .mbtn:active{transform:scale(.97)}
  button:disabled{opacity:.4}
  #wlabel{max-width:120px;font-size:12px;color:#a8988a;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Joker: eigenständig oben rechts */
  #bJoker{position:fixed;top:14px;right:calc((var(--rail) - 96px)/2);width:96px;height:96px;border-radius:50%;z-index:32;
    border:3px solid #2a2a2c;background:radial-gradient(circle at 40% 30%,#ffe9a0,#d9a52e 45%,#6b4a0e 100%);
    box-shadow:0 0 0 2px #8c6a3c,0 0 22px rgba(255,200,80,.55),0 8px 18px rgba(0,0,0,.8);
    color:#2a1600;font-size:34px;line-height:1;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:jglow 1.6s ease-in-out infinite}
  #bJoker span{font-size:13px;letter-spacing:1.5px;margin-top:2px}
  #bJoker:active{transform:scale(.95)}
  @keyframes jglow{50%{box-shadow:0 0 0 2px #d9b678,0 0 40px rgba(255,210,90,.95),0 8px 18px rgba(0,0,0,.8)}}
  #gear{position:fixed;bottom:16px;right:calc((var(--rail) - 62px)/2);width:62px;height:62px;border-radius:50%;
    border:1px solid #4a4a4e;background:radial-gradient(circle at 40% 30%,#4a4a4f,#121214);font-size:28px;
    box-shadow:0 6px 16px rgba(0,0,0,.8);z-index:31}
  #gear.on{box-shadow:0 0 0 2px var(--bronze),0 6px 16px rgba(0,0,0,.8)}

  /* ---------- Update-Knopf + Dialog ---------- */
  #bUpd{position:fixed;bottom:90px;right:calc((var(--rail) - 50px)/2);width:50px;height:50px;border-radius:50%;z-index:31;
    border:1px solid #4a4a4e;background:radial-gradient(circle at 40% 30%,#3a3a3f,#121214);color:#f2c45a;font:800 22px system-ui;
    box-shadow:0 6px 16px rgba(0,0,0,.8)}
  #bUpd.new{border-color:#f2c45a;animation:jglow 1.6s ease-in-out infinite}
  #bUpd.new::after{content:'';position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#e23a3a;border:2px solid #111}
  #upd{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:70;display:none;align-items:center;justify-content:center}
  #upd.show{display:flex}
  #updBox{width:min(520px,92vw);background:#151517;border:1px solid #c9a24e;border-radius:14px;padding:16px 18px;color:#eee}
  #updBox h3{font:700 20px Georgia,serif;color:#ffe08a;margin:0 0 8px}
  #updBox p{margin:6px 0;line-height:1.4}
  #updBox .uv{color:#c9b48a;font-size:13px}
  #updNotes{white-space:pre-line;background:#0d0d0f;border:1px solid #333;border-radius:10px;padding:8px 10px;max-height:40vh;overflow:auto;display:none}
  #updBox .ub{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  #updBox button{padding:10px 16px;border-radius:10px;border:1px solid #c9a24e;background:#1e1712;color:#ffe08a;font:700 15px system-ui}
  #updBox button.pri{background:linear-gradient(#d9a52e,#8a6312);color:#1a0f00}
  /* ---------- Verwaltungs-Panel unten rechts (kein Vollbild) ---------- */
  #panel{position:fixed;right:calc(var(--rail) + 6px);bottom:12px;width:min(480px,calc(100vw - var(--rail) - 24px));
    max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;-webkit-overflow-scrolling:touch;
    background:rgba(16,16,18,.97);border:1px solid #3a3a3e;border-radius:14px;padding:6px 10px 12px;z-index:30;
    box-shadow:0 12px 40px rgba(0,0,0,.9);display:none;-webkit-user-select:text;user-select:text}
  #panel.open{display:block}
  details{border-bottom:1px solid #2a2a2e;padding:4px 0}
  summary{padding:10px 4px;font-weight:700;color:#f0e2c0;cursor:pointer;list-style:none}
  summary::before{content:"▸ ";color:var(--bronze)}
  details[open]>summary::before{content:"▾ "}
  #panel label{display:block;font-size:12px;color:#a8988a;margin:6px 0}
  #panel input[type=text],#panel input[type=number],#panel select{width:100%;padding:8px;border-radius:8px;border:1px solid #3a3a3e;
    background:#0b0b0c;color:#f3e7cc;margin-top:3px}
  #panel button.b{padding:9px 12px;border-radius:9px;border:1px solid #444;background:#232326;color:var(--cream);margin:4px 4px 4px 0}
  #panel button.b.pri{background:#6a1016;border-color:#8c2a30}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0}
  .wchip{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #333;border-radius:9px;background:#141416;font-size:13px;cursor:pointer;min-width:0}
  .wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wchip.on{border-color:var(--bronze);background:#2a1214}
  .wchip input{width:20px;height:20px;flex:none;accent-color:#a8242c}
  .frow{border:1px solid #2c2c30;border-radius:10px;padding:7px;margin:7px 0;background:#121214}
  .frow.hl{border-color:var(--bronze)}
  .ftop{display:grid;grid-template-columns:26px 62px 1fr 38px;gap:6px;align-items:center}
  .ftop input{margin-top:0!important}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid #000;box-shadow:0 0 0 1px var(--bronze);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .fsub{display:grid;grid-template-columns:76px 1fr;gap:6px;margin-top:6px;align-items:center}
  .fsub input,.fsub select{margin-top:0!important;padding:6px!important}
  .fmed{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:#a8988a}
  .fmed button{padding:6px 9px;border-radius:8px;border:1px solid #444;background:#1d1d20;color:var(--cream);font-size:12px}
  .x{height:36px;border-radius:8px;border:1px solid #4a2a2c;background:#2a1012;color:#e9a}
  .hint{font-size:12px;color:#8d8073;line-height:1.45}
  .chk{display:flex!important;align-items:center;gap:8px;font-size:14px!important;color:var(--cream)!important}
  .chk input{width:20px;height:20px;accent-color:#a8242c}
  input[type=range]{width:100%;accent-color:#a8242c}

  /* ---------- Ergebnis-Anzeige (groß, über Foto/Video) ---------- */
  #result{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #result.nomedia{background:rgba(0,0,0,.78)}
  #result.show::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 45% 50%,rgba(255,244,200,1),rgba(255,190,70,.75) 35%,rgba(140,20,20,.35) 70%,transparent 90%);
    animation:flashA 1s ease-out forwards}
  @keyframes flashA{0%{opacity:1}25%{opacity:.85}100%{opacity:0}}
  #result.show{display:block}
  #rMedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #rMedia video,#rMedia img{width:100%;height:100%;object-fit:contain}
  #rText{position:absolute;left:0;right:var(--rail);top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;text-align:center;padding:4vh 3vw;font-family:Georgia,"Times New Roman",serif;font-weight:700;
    color:#f6e7c1;text-shadow:0 3px 0 #3a070b,0 0 24px #000,0 0 6px #000;text-transform:uppercase}
  #rNum{font-size:min(30vh,22vw);line-height:1}
  #rTxt{white-space:pre-line;font-size:min(14vh,9vw);line-height:1.08;max-width:100%;word-wrap:break-word}
  #rUnit{font-size:min(6vh,4vw);opacity:.9}
  #rVctl{position:absolute;left:14px;right:calc(var(--rail) + 4px);bottom:14px;display:none;align-items:center;gap:10px;z-index:3;
    padding:8px 12px;border-radius:14px;background:rgba(10,8,8,.72);border:1px solid #5a4520}
  #result.hasvid #rVctl{display:flex}
  #rVctl button{min-width:64px;height:48px;border-radius:12px;border:1px solid #c9a24e;background:#1e1712;color:#ffe08a;font:800 16px system-ui}
  #rVctl input{flex:1;accent-color:#c9a24e;height:28px}
  #rVctl b{color:#ffe08a;font:600 14px system-ui;min-width:96px;text-align:right}
  #result.hasvid #rText{left:0;right:0;bottom:auto;justify-content:flex-start;align-items:center;text-align:center;padding:2vh 4vw 0;pointer-events:none}
  #result.hasvid #rNum{font-size:min(14vh,10vw)}
  #result.hasvid #rTxt{font-size:min(8vh,5.5vw)}
  #result.hasvid #rUnit{font-size:min(4vh,3vw)}
  #rBtns{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;width:calc(var(--rail) - 14px);align-items:center}
  #rBtns .mbtn{width:100%}
  #rNext{display:none}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  #result.show #rText>*{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}

  /* ---------- Timer-Rad (Vollbild-Ansicht) ---------- */
  #timerView{position:fixed;inset:0;background:var(--bg);z-index:40;display:none}
  #timerView.show{display:block}
  #tStage{position:absolute;left:0;top:0;bottom:0;right:var(--rail)}
  #tcv{width:100%;height:100%;display:block}
  #tRail{position:absolute;right:0;top:0;bottom:0;width:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #tClock{font:800 34px/1 ui-monospace,Menlo,monospace;color:#f2c45a;text-shadow:0 0 12px rgba(242,196,90,.4)}
  #tClock.warn{color:#ff4d4d;text-shadow:0 0 14px #f00}
  .trow{display:flex;gap:8px}
  .trow button{width:52px;height:44px;border-radius:10px;border:1px solid #4a4a4e;background:linear-gradient(#3b3b3f,#141416);font-size:22px;font-weight:700}
  #tResult{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    font:700 min(11vh,8vw)/1.05 Georgia,serif;text-transform:uppercase;color:#f6e7c1;text-align:center;padding:0 4vw;
    text-shadow:0 4px 0 #3a070b,0 0 30px #000,0 0 10px #000;opacity:0;transition:opacity .3s}
  #tResult.show{opacity:1}

  /* ---------- Video-Zuschneider ---------- */
  #mimp{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center}
  #mimp.show{display:flex}
  #mimpBox{width:min(820px,94vw);max-height:96vh;overflow:auto;background:#151517;border:1px solid #c9a24e;border-radius:14px;padding:12px 14px}
  #mimpBox .mt{font:700 18px Georgia,serif;color:#ffe08a;margin-bottom:8px}
  #mimpView{background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:180px}
  #mimpView video,#mimpView img{max-width:100%;max-height:48vh;display:block}
  #mimpEmpty{color:#8a7a66;font-size:14px;display:flex;align-items:center;justify-content:center;height:180px}
  .mrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .mrow input[type=range]{flex:1;min-width:160px;accent-color:#c9a24e}
  .mrow b{color:#ffe08a;font-size:13px;min-width:56px}
  .ml{color:#a8988a;font-size:13px;min-width:96px}
  #mBar{position:relative;height:12px;margin-top:8px;border-radius:6px;background:#2a2a2e}
  #mSel{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#8a1219,#c9a24e);border-radius:6px}
  #mCur{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:#fff}
  #mimpBox .b{padding:10px 14px;border-radius:9px;border:1px solid #444;background:#232326;color:var(--cream)}
  #mimpBox .b.pri{background:#6a1016;border-color:#c9a24e}
  #mimpBox .b.on{border-color:#ffe08a;color:#ffe08a}
  .mbtns{margin-top:12px}
  .medbtn{padding:9px 12px!important;border-radius:9px!important;border:1px solid #c9a24e!important;background:#2a1a0e!important;color:#ffe08a!important;font-size:13px!important;font-weight:700}

  /* Dreh-Buttons unter den Rädern (ab 2 Rädern) */
  #wbtns{position:absolute;inset:0;pointer-events:none}
  .wctl{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:10px;pointer-events:none}
  .wspin{pointer-events:auto;flex:none;width:62px;height:62px;border-radius:50%;padding:0;
    background:radial-gradient(circle at 38% 30%,#d0343a 0,#8a1219 42%,#3d0408 100%);border:5px solid #232326;
    box-shadow:0 0 0 2px #6d5531,inset 0 3px 8px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.6),0 8px 18px rgba(0,0,0,.8);
    color:#f6e8c6;font-weight:800;font-size:10.5px;letter-spacing:.5px;text-shadow:0 2px 0 #2a0204}
  .wspin.on{box-shadow:0 0 0 2px #e8c47a,0 0 16px rgba(232,196,122,.6),inset 0 3px 8px rgba(255,255,255,.25),0 8px 18px rgba(0,0,0,.8)}
  .wspin:active{transform:scale(.95)}
  /* Letzte 5 Ergebnisse im goldenen Rahmen */
  .hist{pointer-events:none;display:flex;gap:0;align-items:center;min-height:34px;padding:4px 6px;border-radius:9px;
    border:2px solid #c9a24e;background:linear-gradient(#1a140a,#0b0905);
    box-shadow:0 0 0 1px #5a4520,inset 0 0 0 1px #f3d58a55,inset 0 2px 6px rgba(0,0,0,.8),0 4px 12px rgba(0,0,0,.7);
    font:700 13px/1.1 Georgia,serif;color:#e9d6a6;text-transform:uppercase;overflow:hidden;white-space:nowrap}
  .hist span{flex:0 1 auto;min-width:0;padding:2px 8px;overflow:hidden;text-overflow:ellipsis;opacity:.6;border-left:1px solid #5a4520}
  .hist span:first-child{flex-shrink:0;border-left:0;opacity:1;color:#ffe08a;text-shadow:0 0 8px rgba(255,210,100,.6)}
  .hist i{opacity:.4;font-style:normal;padding:0 8px}
  /* Speicherkarten */
  .card{border:1px solid #2c2c30;border-left:4px solid var(--bronze);border-radius:10px;padding:8px;margin:7px 0;background:#121214}
  .card.combo{border-left-color:#a8242c}
  .card b{color:#f0e2c0}
  .card .meta{font-size:12px;color:#8d8073}
  .card button{padding:7px 10px;border-radius:8px;border:1px solid #444;background:#1d1d20;color:var(--cream);font-size:12px;margin:5px 4px 0 0}
  .card button.go{background:#6a1016;border-color:#8c2a30}
  /* Vorlieben-Fragebogen */
  #quiz{position:fixed;inset:0;background:#070607;z-index:45;display:none;flex-direction:column;-webkit-user-select:text;user-select:text}
  #quiz.show{display:flex}
  #paywall{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at top,#2a0c10,#050505 70%);display:none;overflow:auto;color:#eee;padding:22px 24px 30px}
  #paywall.show{display:block}
  #paywall h1{font:700 36px Georgia,serif;color:#ffe08a;text-align:center;margin:4px 0;letter-spacing:2px}
  #paywall .pwsub{text-align:center;color:#c9b48a;margin-bottom:16px}
  .pwgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:980px;margin:0 auto}
  .pwcard{border:2px solid #5a4520;border-radius:18px;padding:16px 18px;background:#120d0b}
  .pwcard.pro{border-color:#c9a24e;box-shadow:0 0 30px rgba(201,162,78,.25)}
  .pwcard.cur{outline:3px solid #6fd16f;outline-offset:3px}
  .pwcard h2{font:700 24px Georgia,serif;color:#ffe08a;margin:0 0 8px}
  .pwcard ul{margin:0 0 12px;padding:0;list-style:none;line-height:1.65;font-size:15px}
  .pwcard li.no{opacity:.45}
  .pwbuy{display:block;width:100%;margin:8px 0 0;padding:12px;border-radius:12px;border:1px solid #c9a24e;background:#6a1016;color:#fff;font-weight:700;font-size:17px}
  .pwbuy.alt{background:#1e1712}
  .pwbuy small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
  .pwwarn{max-width:980px;margin:0 auto 14px;padding:12px 16px;border:1px solid #ff6b6b;border-radius:12px;background:#2a0b0b;color:#ffd0d0}
  .pwfoot{max-width:980px;margin:16px auto 0;color:#9a8a76;font-size:13px;text-align:center;line-height:1.6}
  .pwtest{margin-top:10px;padding-top:10px;border-top:1px dashed #3a3020}
  #pwClose{position:fixed;top:14px;right:14px;width:48px;height:48px;border-radius:50%;border:1px solid #c9a24e;background:#151110;color:#ffe08a;font-size:20px}
  .lock{font-size:10px;background:#c9a24e;color:#000;border-radius:6px;padding:1px 5px;margin-left:4px;font-weight:800;vertical-align:middle}
  #qHead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:2px solid #c9a24e;background:linear-gradient(#1a140a,#0b0905)}
  #qHead .qt{font:700 20px Georgia,serif;color:#ffe08a;margin-right:auto;text-transform:uppercase}
  .qtab{padding:10px 14px;border-radius:10px;border:1px solid #5a4520;background:#151110;color:#e9d6a6;font-weight:700}
  .qtab.on{background:#6a1016;border-color:#c9a24e;color:#fff}
  #qBody{flex:1;overflow:auto;padding:10px 18px 30px}
  #qBody h3{font:700 18px Georgia,serif;color:#ffe08a;margin:18px 0 6px;text-transform:uppercase;border-bottom:1px solid #3a2e18;padding-bottom:4px}
  .qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #1d1a16}
  .qrow .qq{color:#efe3c6;font-size:15px}
  .qrate{display:flex;gap:5px}
  .qrate button{width:42px;height:40px;border-radius:9px;border:1px solid #3a3a3e;background:#141416;color:#cbbd9e;font-weight:800;font-size:16px}
  .qrate button.on{color:#fff;border-color:#e8c47a}

<script>
'use strict';
/* =====================================================================
   Konstanten & Farbpaletten
   ===================================================================== */
const MAX_WHEELS = 12, MIN_FIELDS = 2, MAX_FIELDS = 20, MAX_CHAIN = 6;
const T_MIN = 3, T_MAX = 9;
const TOY_PATS = {konstant:'Konstant', puls:'Puls', welle:'Welle', steigernd:'Steigernd', zufall:'Zufall'};   // Timer-Rad: 3 bis 9 Felder
const TAU = Math.PI * 2;
const STORE_KEY = 'fickrad.v2';

// a/b = abwechselnde Segmentfarben, c = Ausgleichsfarbe bei ungerader Feldzahl
const PALETTES = {
  klassik:  {name:'Klassik Rot / Creme',   a:'#6a1016', b:'#e6d8b8', c:'#8f5a2c'},
  smaragd:  {name:'Smaragd / Gold',        a:'#0f4a3a', b:'#d9c27a', c:'#6a7a3a'},
  amethyst: {name:'Amethyst / Rosé',       a:'#4b1a5e', b:'#efc9d6', c:'#8a4a78'},
  petrol:   {name:'Petrol / Sand',         a:'#0e4752', b:'#e3d2ae', c:'#5b7a6e'},
  onyx:     {name:'Onyx / Gold',           a:'#141414', b:'#c9a54e', c:'#5a4a2a'},
  lava:     {name:'Lava / Orange',         a:'#7a1c06', b:'#f2a33a', c:'#b5501a'},
  eis:      {name:'Mitternacht / Eis',     a:'#14214d', b:'#cfe3ef', c:'#5a6f96'},
  neon:     {name:'Neon Pink / Schwarz',   a:'#0d0d0d', b:'#ff2f8e', c:'#7a1d55'},
};

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================
   Zustand (localStorage)
   ===================================================================== */
function newField(text = '') { return {num:'', text, weight:1, next:-1, card:null, media:null, toy:{lvl:0, sec:5, pat:'konstant', dev:''}}; }
function newWheel(i) {
  return {title:'Rad ' + (i + 1), unit:'', palette:'klassik', enabled:i === 0,
          fields:Array.from({length:4}, () => newField()), rot:0, history:[]};
}
function defaultState() {
  return {
    active:0,
    settings:{sound:true, spinSec:6, speakMain:false, autoNext:5, resultSec:3, mode:'rad', slotHist:[]},
    toy:{enabled:false, url:'ws://127.0.0.1:12345', master:100},
    quiz:{names:{a:'Er', b:'Sie'}, ans:{}, learn:{}, stufe:{}, stufeSel:0, lvlOv:{}, thr:2.5, map:{}, timer:true, custom:{}, session:null, fb:null, sessions:[]},   // Vorlieben-Fragebogen   // Sexspielzeug über Intiface Central
    joker:{num:'', text:'JOKER', weight:1, next:-1, card:null, media:null, seqs:[]},   // seqs = gespeicherte Abfolgen   // eigenständiges Joker-Feld
    presets:[],      // Speicherkarten: {id, name, kind:'single'|'combo', data}
    snapshot:null,   // Räder vor dem Laden einer Karte (für ↩ VORHER)
    wheels:Array.from({length:MAX_WHEELS}, (_, i) => newWheel(i)),
    timer:{seconds:60, auto:true, voice:true, prefix:'', pause:5, pitch:0.3, rate:0.8,
      wheel:{title:'Timer', unit:'', palette:'klassik', enabled:true, rot:0,
        fields:[newField('in die Muschi'), newField('in Arsch'), newField('in den Mund')]}}
  };
}
// Geladene/importierte Daten in eine saubere Struktur bringen
function normField(f) {
  f = Object.assign(newField(), f || {});
  f.num = (f.num === '' || f.num == null || isNaN(+f.num)) ? '' : clamp(Math.round(+f.num), 0, 99);
  f.text = String(f.text ?? '');
  f.weight = clamp(+f.weight || 0, 0, 100);
  f.next = Number.isInteger(+f.next) ? clamp(+f.next, -1, MAX_WHEELS - 1) : -1;
  f.card = (typeof f.card === 'string' && f.card) ? f.card : null;
  if (f.qid != null && typeof f.qid !== 'string') delete f.qid;
  const t = f.toy || {};
  f.toy = {lvl:clamp(Math.round(+t.lvl || 0), 0, 100), sec:clamp(+t.sec || 5, 0.5, 600), pat:TOY_PATS[t.pat] ? t.pat : 'konstant', dev:String(t.dev || '')};
  if (f.media && !f.media.id) f.media = null;
  return f;
}
function normWheel(w, i) {
  const d = newWheel(i);
  w = Object.assign(d, w || {});
  if (!PALETTES[w.palette]) w.palette = 'klassik';
  w.fields = (Array.isArray(w.fields) ? w.fields : []).slice(0, MAX_FIELDS).map(normField);
  while (w.fields.length < MIN_FIELDS) w.fields.push(newField());
  w.rot = +w.rot || 0;
  w.history = (Array.isArray(w.history) ? w.history : []).map(String).slice(0, 5);
  return w;
}
function normalize(o) {
  const d = defaultState();
  if (!o || typeof o !== 'object') return d;
  const s = {active:clamp(+o.active || 0, 0, MAX_WHEELS - 1),
             settings:Object.assign(d.settings, o.settings || {}), toy:Object.assign(d.toy, o.toy || {}), quiz:Object.assign(d.quiz, o.quiz || {}),
             wheels:[], timer:Object.assign(d.timer, o.timer || {})};
  for (let i = 0; i < MAX_WHEELS; i++) s.wheels.push(normWheel((o.wheels || [])[i], i));
  s.timer.wheel = normWheel(s.timer.wheel, 0);
  s.timer.wheel.fields = s.timer.wheel.fields.slice(0, T_MAX);
  while (s.timer.wheel.fields.length < T_MIN) s.timer.wheel.fields.push(newField());
  s.joker = normField(Object.assign({text:'JOKER'}, o.joker || {}));
  s.joker.seqs = (Array.isArray(s.joker.seqs) ? s.joker.seqs : []).map(q => ({id:String(q.id || 'q' + uid()), name:String(q.name || 'Abfolge'),
    steps:(Array.isArray(q.steps) ? q.steps : []).map(st => ({t:String(st.t || 'w0'), n:clamp(Math.round(+st.n || 1), 1, 50)}))}));
  s.presets = (Array.isArray(o.presets) ? o.presets : []).map(normCard).filter(Boolean);
  s.snapshot = (o.snapshot && Array.isArray(o.snapshot.wheels))
    ? {active:+o.snapshot.active || 0, wheels:o.snapshot.wheels.map((w, i) => normWheel(w, i))} : null;
  if (!s.wheels.some(w => w.enabled)) s.wheels[0].enabled = true;
  if (!s.wheels[s.active].enabled) s.active = s.wheels.findIndex(w => w.enabled);
  return s;
}
function normCard(c) {
  if (!c || !c.data || (c.kind !== 'single' && c.kind !== 'combo')) return null;
  const out = {id:String(c.id || 'c' + uid()), name:String(c.name || 'Karte'), kind:c.kind, created:+c.created || Date.now(), data:{}};
  if (c.kind === 'single') { if (!c.data.wheel) return null; out.data.wheel = normWheel(c.data.wheel, 0); }
  else {
    const slots = (Array.isArray(c.data.slots) ? c.data.slots : []).filter(x => x && x.wheel && x.slot >= 0 && x.slot < MAX_WHEELS);
    if (!slots.length) return null;
    out.data = {active:+c.data.active || slots[0].slot, slots:slots.map(x => ({slot:+x.slot, wheel:normWheel(x.wheel, +x.slot)}))};
  }
  return out;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const strip = o => JSON.parse(JSON.stringify(o, (k, v) => k[0] === '_' ? undefined : v));
let S;
try { S = normalize(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { S = defaultState(); }

let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    // Felder mit "_" (Laufzeit-Infos) nicht speichern
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v)); }
    catch (e) { toast('Speichern nicht möglich: ' + e.message); }
  }, 250);
}

/* =====================================================================
   Medien in IndexedDB (Fallback: nur im Arbeitsspeicher)
   ===================================================================== */
const DB = {
  db:null, mem:new Map(),
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('fickrad-media', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('media');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('media', mode), st = t.objectStore('media');
      const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  },
  async put(id, blob) { if (!this.db) { this.mem.set(id, blob); return; } await this.tx('readwrite', s => s.put(blob, id)); },
  async get(id) { if (!this.db) return this.mem.get(id) || null; return (await this.tx('readonly', s => s.get(id))) || null; },
  async del(id) { urlCache.delete(id); if (!this.db) { this.mem.delete(id); return; } await this.tx('readwrite', s => s.delete(id)); },
};
const urlCache = new Map();
async function mediaURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await DB.get(id); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}

/* =====================================================================
   Töne (WebAudio): Tick pro Feld, Stopp-Glocke, Timer-Piepen
   ===================================================================== */
let AC = null;
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, t0 = 0, slideTo) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function tick() { if (S.settings.sound) tone(2100, 0.035, 'square', 0.12, 0, 700); }
function stopSound() {
  if (!S.settings.sound) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 1.4, 'sine', 0.22, i * 0.07));
}
function beep(loud, dur = 0.22, f = 1000) { tone(f, dur, 'square', loud ? 0.5 : 0.18); }

/* =====================================================================
   Zeichnen: Hammerschlag-Metall, Ring, Spitze, Nabe, Segmente
   ===================================================================== */
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/* Hammerschlag-Textur: dunkler Metallverlauf + viele kleine Dellen,
   Licht kommt von oben (oben hell, unten dunkel). */
function hammer(ctx, clipFn, box, R, seed, count, sample) {
  ctx.save(); clipFn(ctx); ctx.clip();
  const g = ctx.createLinearGradient(0, box.y, 0, box.y + box.h);
  g.addColorStop(0, '#5c5c61'); g.addColorStop(0.42, '#2a2a2d'); g.addColorStop(1, '#09090a');
  ctx.fillStyle = g; ctx.fillRect(box.x, box.y, box.w, box.h);
  const r = rng(seed), s0 = R * 0.03;
  for (let k = 0; k < count; k++) {
    const [x, y] = sample ? sample(r) : [box.x + r() * box.w, box.y + r() * box.h];
    const s = s0 * (0.45 + r() * 1.05);

/* Zwischenspeicher für vorgerenderte Ebenen (teure Textur nur einmal pro Größe) */

/* =====================================================================

/* =====================================================================

      drawWheel(ctx, S.wheels[focus.idx], big.cx, big.cy, big.R * (0.3 + 0.7 * p), {cacheR:big.R, alpha:p, glow:true,
        glowColor:focus.jockey ? 'rgba(255,190,60,.95)' : undefined, bulbs:focus.jockey ? (Math.floor(now / 130) % 2) + 1 : 0, title:S.wheels[focus.idx].title});
    }

    const r = rects[k];
    drawWheel(ctx, S.wheels[wi], r.cx, r.cy, r.R, {
      glow: vis.length > 1 && wi === S.active && !focus,
      alpha: focus ? 1 - 0.85 * p : 1,

  });

    try { NATIVE.speak(text, clamp(+S.timer.pitch, 0.1, 2), clamp(+S.timer.rate, 0.3, 1.5)); } catch (e) { fin(); }
  });
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; const v = pickVoice(); if (v) u.voice = v;
    u.pitch = clamp(+S.timer.pitch, 0, 2); u.rate = clamp(+S.timer.rate, 0.3, 1.5); u.volume = 1;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 5000 + text.length * 180);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* =====================================================================
   Timer-Rad: Zeit → lautes Piepen → Drehen → Ansage → wieder von vorn
   ===================================================================== */
const T = {run:false, tok:0, flash:0, wake:null};
function renderTimer(now = performance.now()) {
  const cv = $('#tcv'), ctx = cv.getContext('2d'), {W, H} = sizeCanvas(cv);
  ctx.clearRect(0, 0, W, H);
  const r = bigRect(W, H);
  drawWheel(ctx, S.timer.wheel, r.cx, r.cy, r.R, {bulbs:T.flash, glow:T.run, glowColor:'rgba(200,30,40,.8)', title:S.timer.wheel.title});
}
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function showClock(s) { const c = $('#tClock'); c.textContent = fmt(s); c.classList.toggle('warn', T.run && s <= 3); }
function updT() { $('#tStart').textContent = T.run ? 'STOPP' : 'START'; if (!T.run) showClock(S.timer.seconds); renderTimer(); }
async function wakeLock(on) {
  try {
    if (on && 'wakeLock' in navigator && !T.wake) T.wake = await navigator.wakeLock.request('screen');
    if (!on && T.wake) { T.wake.release(); T.wake = null; }
  } catch (e) {}
}
async function timerRun() {
  const tok = ++T.tok; T.run = true; ac(); updT(); wakeLock(true);
  const alive = () => T.run && T.tok === tok;
  const w = S.timer.wheel;
  while (alive()) {
    let rem = Math.max(1, Math.round(S.timer.seconds));
    showClock(rem); $('#tResult').classList.remove('show'); w._hl = null; renderTimer();
    while (rem > 0 && alive()) {
      await sleep(1000); if (!alive()) break;
      rem--; showClock(rem);
      if (rem > 0 && rem <= 3) beep(false, 0.12, 880);
    }
    if (!alive()) break;
    for (let k = 0; k < 4 && alive(); k++) {          // lautes Piepen + Lichter
      T.flash = 3; renderTimer(); beep(true, 0.28, 1250); await sleep(300);
      T.flash = 0; renderTimer(); await sleep(170);
    }
    if (!alive()) break;
    T.flash = 0;
    const res = await spinAnim(w, now => { T.flash = (Math.floor(now / 160) % 2) + 1; renderTimer(now); }, S.settings.spinSec);
    T.flash = 0; if (!alive()) break;
    stopSound(); await flashWin(w, res, renderTimer);
    const f = w.fields[res], line = resultLine(w, f, res);
    quizLog(f);
    toyPlay(f.toy);
    $('#tResult').textContent = line; $('#tResult').classList.add('show');
    if (S.timer.voice) await speak((S.timer.prefix ? S.timer.prefix + ' ' : '') + line);
    if (!alive()) break;
    await sleep(clamp(+S.timer.pause, 0, 120) * 1000);
    if (!S.timer.auto) break;
  }
  if (T.tok === tok) { T.run = false; T.flash = 0; wakeLock(false); updT(); }
}
function timerStop() { toyStop(); T.run = false; T.tok++; T.flash = 0; stopSpeech(); wakeLock(false); updT(); }
function openTimer() {
  closePanel(); $('#timerView').classList.add('show'); $('#tResult').classList.remove('show');
  goFullscreen(); requestAnimationFrame(() => updT());
}

function initPanelEvents() {
  const P = $('#panel');
  P.addEventListener('toggle', e => {
    const d = e.target; if (!d.dataset || !d.dataset.sec) return;
    d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec);
  }, true);

  P.addEventListener('input', e => {
    const el = e.target, w = S.wheels[S.active];
    if (el.dataset.fp) {
      const f = w.fields[+el.dataset.f], k = el.dataset.fp;
      if (k === 'num') f.num = el.value === '' ? '' : clamp(Math.round(+el.value), 0, 99);
      else if (k === 'text') f.text = el.value;
      else if (k === 'weight') f.weight = clamp(+el.value || 0, 0, 100);
      else if (k === 'next') { const v = el.value; f.next = v[0] === 'w' ? +v.slice(1) : -1; f.card = v[0] === 'c' ? v.slice(1) : null; }
      save(); return;
    }
    if (el.dataset.wp) {
      const k = el.dataset.wp; w[k] = el.value;

function mimpShow(url, type, name, mime, st = 0, en = 0, own = false) {

/* =====================================================================
   Export / Import (JSON und unkomprimiertes ZIP mit Medien)
   ===================================================================== */
// Läuft durch alle Felder (Räder, Timer, Speicherkarten, Sicherung) und ruft cb für Felder mit Medium auf
function walkMedia(o, cb) {
  if (!o || typeof o !== 'object') return;
  if (Array.isArray(o)) { o.forEach(x => walkMedia(x, cb)); return; }
  if (o.media && o.media.id) cb(o);
  for (const k in o) if (k !== 'media') walkMedia(o[k], cb);
}
function allMediaIds() { const ids = new Set(); walkMedia(S, f => ids.add(f.media.id)); return [...ids]; }
function mediaInUse(id) { let u = false; walkMedia(S, f => { if (f.media.id === id) u = true; }); return u; }
function delMedia(id) { if (id && !mediaInUse(id)) DB.del(id).catch(() => {}); }
function cleanState(withMedia) {
  const o = strip(S);
  if (!withMedia) walkMedia(o, f => f.media = null);
  return o;
}
// Medien aus ZIP speichern bzw. fehlende Medien-Verweise entfernen
async function restoreMedia(obj, z) {
  const list = []; walkMedia(obj, f => list.push(f));
  for (const f of list) {
    const data = z && z['media/' + f.media.id];
    if (data) await DB.put(f.media.id, new Blob([data], {type:f.media.mime || (f.media.type === 'video' ? 'video/mp4' : 'image/jpeg')}));
    else if (!(await DB.get(f.media.id))) f.media = null;
  }
}
async function zipWithMedia(obj, jsonName) {
  const files = [], seen = new Set(), list = [];
  walkMedia(obj, f => list.push(f));
  for (const f of list) {
    if (seen.has(f.media.id)) continue; seen.add(f.media.id);
    const b = await DB.get(f.media.id);
    if (b) files.push({name:'media/' + f.media.id, data:new Uint8Array(await b.arrayBuffer())});
  }
  list.forEach(f => { if (!seen.has(f.media.id) || !files.some(x => x.name === 'media/' + f.media.id)) f.media = null; });
  files.unshift({name:jsonName, data:new TextEncoder().encode(JSON.stringify(obj, null, 2))});
  return makeZip(files);
}

/* ---------- Speicherkarten ---------- */
function saveCard(kind, name) {
  const w = S.wheels[S.active];
  name = (name || '').trim() || (kind === 'single' ? (w.title || 'Rad') : 'Kombination ' + (S.presets.filter(c => c.kind === 'combo').length + 1));
  const data = kind === 'single' ? {wheel:strip(w)}
    : {active:S.active, slots:visibleIdx().map(i => ({slot:i, wheel:strip(S.wheels[i])}))};
  const ex = S.presets.find(c => c.kind === kind && c.name === name);
  if (ex) { const old = []; walkMedia(ex, f => old.push(f.media.id)); ex.data = data; old.forEach(delMedia); toast('Karte „' + name + '“ überschrieben'); }
  else { S.presets.push({id:'c' + uid(), name, kind, created:Date.now(), data}); toast('Karte „' + name + '“ gespeichert'); }
  save(); renderPanel();
}
function loadCard(id) {
  const c = S.presets.find(x => x.id === id); if (!c) { toast('Karte nicht gefunden'); return null; }
  if (!S.snapshot) S.snapshot = {active:S.active, wheels:strip(S.wheels)};   // für ↩ VORHER
  if (c.kind === 'single') {
    const i = S.active, w = normWheel(strip(c.data.wheel), i);
    w.enabled = true; S.wheels[i] = w;
  } else {
    S.wheels.forEach(w => w.enabled = false);
    c.data.slots.forEach(x => { const w = normWheel(strip(x.wheel), x.slot); w.enabled = true; S.wheels[x.slot] = w; });
    S.active = S.wheels[c.data.active] && S.wheels[c.data.active].enabled ? c.data.active : c.data.slots[0].slot;
  }
  save(); render(); renderPanel(); updateRail();
  return c;
}
async function runCard(id, depth = 0) {
  if (busy) return;
  const c = loadCard(id); if (!c) return;
  await sleep(400);
  if (c.kind === 'single') await doSpin(S.active, depth);
  else for (const x of c.data.slots) { if (S.wheels[x.slot].enabled) await doSpin(x.slot, depth); }
}
function undoCard() {
  if (!S.snapshot) return;
  S.wheels = S.snapshot.wheels.map((w, i) => normWheel(w, i)); S.active = S.snapshot.active; S.snapshot = null;
  if (!S.wheels.some(w => w.enabled)) S.wheels[0].enabled = true;
  if (!S.wheels[S.active].enabled) S.active = visibleIdx()[0];
  save(); render(); renderPanel(); updateRail(); toast('Vorherige Räder wiederhergestellt');
}
// Übermitteln: über das Teilen-Menü (WhatsApp, Quick Share, Bluetooth …) oder als Datei
async function shareCard(id) {
  const c = S.presets.find(x => x.id === id); if (!c) return;
  const obj = {fickradCard:1, card:strip(c)}, base = 'sexrad-karte-' + c.name.replace(/[^\wäöüÄÖÜß-]+/g, '_');
  let hasMedia = false; walkMedia(obj, () => hasMedia = true);
  const file = hasMedia
    ? new File([await zipWithMedia(obj, 'card.json')], base + '.zip', {type:'application/zip'})
    : new File([JSON.stringify(obj, null, 2)], base + '.json', {type:'application/json'});
  if (NATIVE) { await nativeFile(file, file.name, 'share'); return; }
  if (navigator.canShare && navigator.canShare({files:[file]})) {

  const lv = [1, 2, 3, 4].map(L => { const its = allQuizItems().filter(it => itemLvl(it.id) === L); let m = 0, r = 0;
    its.forEach(it => { const a = eff(it.id, 'a'), b = eff(it.id, 'b'); if (!a || !b) return; r++; if (a >= 1.5 && b >= 1.5 && Math.sqrt(a * b) >= QS().thr) m++; });
    return {L, n:its.length, m, pct:r ? Math.round(m / r * 100) : 0}; });
  const ses = QS().sessions, avgF = ses.length ? Math.round(ses.reduce((n, s) => n + s.fulfil, 0) / ses.length) : null;
  return {pct:rated ? Math.round(match / rated * 100) : 0, pts, match, rated, open, cats, top, sessions:ses.length, avgF, lv};
}
// Persönlicher Vorschlag: gemeinsame Favoriten + Wünsche des Partners, bei denen man „vielleicht“ gesagt hat (nie Tabus)
function quizProposal(who) {
  const N = QS().names, other = who === 'a' ? 'b' : 'a', st = quizStats(), d = new Date().toLocaleDateString('de-DE');
  const wishes = allQuizItems().filter(it => { const me = eff(it.id, who), ot = eff(it.id, other);
    return ot >= 4 && me >= 2.5 && me < 3.5 && quizScore(it.id).state !== 'tabu'; });
  const last = QS().sessions[QS().sessions.length - 1];
  let t = `💞 SexRad – Vorschlag für ${N[who]} (${d})\n\n`;
  t += `Match: ${st.pct} % · ${st.pts} Punkte · ${st.match} gemeinsame Vorlieben\n`;
  t += `Deine Stufe: ${STUFEN[stufeOf(who)]} · ${N[other]}: ${STUFEN[stufeOf(other)]} · gemeinsam: ${STUFEN[stufeSession()]}\n\n`;
  t += `🔥 Eure Top-Gemeinsamkeiten:\n` + (st.top.slice(0, 8).map(x => '  • ' + x.l).join('\n') || '  (noch keine)') + '\n\n';
  if (wishes.length) t += `✨ Das wünscht sich ${N[other]} besonders – du hast „vielleicht“ gesagt. Lust, es auszuprobieren?\n` + wishes.slice(0, 8).map(x => '  • ' + x.q).join('\n') + '\n\n';
  if (last) t += `🏁 Letzte Session (${new Date(last.date).toLocaleDateString('de-DE')}): Erfüllung ${last.fulfil} %` +
    (last.highlights.length ? `\n  Highlights: ${last.highlights.join(', ')}` : '') + '\n\n';
  t += `Alles freiwillig – ein Nein ist immer okay.`;
  return t;
}
async function sendText(text, fname) {
  if (NATIVE) { await nativeFile(new Blob([text], {type:'text/plain'}), fname, 'share'); return; }
  if (navigator.share) { try { await navigator.share({title:'SexRad', text}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast('Text kopiert – zum Verschicken einfügen', 4000); } catch (e) {}
  download(new Blob([text], {type:'text/plain'}), fname);
}

/* ---------- Session: Ergebnisse mitschreiben, danach Rückblick ---------- */
function sessionStart() { QS().session = {start:Date.now(), log:[]}; QS().fb = null; save(); updateRail(); toast('Session gestartet – am Ende „🏁 SESSION ENDE“ drücken', 4000); }
function quizLog(f) { if (!QS().session || !f || !f.qid) return; QS().session.log.push(f.qid); save(); }
function sessionEnd() {
  const s = QS().session;
  if (!QS().fb) QS().fb = {items:[...new Set(s ? s.log : [])], ans:{}, overall:{}};
  save(); openQuiz('fa');
}
// Lernen: Erlebnis fließt zu 40 % in die Vorliebe ein, eine 1 nach dem Erleben macht den Punkt künftig tabu
function sessionLearn() {
  const fb = QS().fb; if (!fb) return;
  const items = [];
  fb.items.forEach(id => {
    const r = fb.ans[id] || {};
    ['a', 'b'].forEach(w => {
      const v = r[w]; if (!(v >= 1)) return;
      const base = eff(id, w) || v;
      (QS().learn[id] = QS().learn[id] || {})[w] = v === 1 ? 1 : clamp(base * 0.6 + v * 0.4, 1, 5);
    });
    if ((r.a >= 1) || (r.b >= 1)) items.push({id, a:r.a || 0, b:r.b || 0});
  });
  const ov = fb.overall, ovs = [ov.a, ov.b].filter(v => v >= 1);
  const fulfil = ovs.length ? Math.round(ovs.reduce((n, v) => n + (v - 1) / 4, 0) / ovs.length * 100) : 0;
  const highlights = items.filter(x => x.a >= 4 && x.b >= 4).map(x => (itemById(x.id) || {}).l).filter(Boolean);
  QS().sessions.push({date:Date.now(), fulfil, items, highlights});
  licTrim();
  QS().session = null; QS().fb = null;
  save(); updateRail();
  return fulfil;
}

function quizApply() {
  if (!S.snapshot) S.snapshot = {active:S.active, wheels:strip(S.wheels)};
  const used = [], skipped = [];
  let timerDone = false;
  QUIZ.forEach(c => {
    const r = quizResult(c), m = QS().map[c.id] ?? c.wheel;
    const mk = x => normField({text:x.l, weight:x.weight, qid:x.id, toy:c.toy ? {lvl:STUFE_TOY[stufeSession()], sec:30, pat:stufeSession() >= 3 ? 'steigernd' : 'welle', dev:''} : undefined});
    if (m >= 0) {
      if (r.inc.length < MIN_FIELDS) skipped.push(c.name);
      else {
        const old = S.wheels[m];
        S.wheels[m] = normWheel({title:c.name, unit:'', palette:old.palette, enabled:true, history:[], fields:r.inc.slice(0, MAX_FIELDS).map(mk)}, m);
        used.push(m);
      }
    }
    if (c.timer && QS().timer) {
      if (r.inc.length >= T_MIN) { S.timer.wheel.fields = r.inc.slice(0, T_MAX).map(mk); timerDone = true; }
      else skipped.push('Timer-Rad');
    }
  });
  if (!used.length) { toast('Zu wenig gemeinsame Treffer – erst beide ausfüllen oder Mut-Regler nach links', 4500); return; }
  S.wheels.forEach((w, i) => w.enabled = used.includes(i));
  S.active = used[0];
  const name = 'Vorlieben ' + new Date().toLocaleDateString('de-DE');
  const data = {active:S.active, slots:used.map(i => ({slot:i, wheel:strip(S.wheels[i])}))};
  const ex = S.presets.find(c => c.kind === 'combo' && c.name === name);
  if (ex) ex.data = data; else S.presets.push({id:'c' + uid(), name, kind:'combo', created:Date.now(), data});
  QS().session = {start:Date.now(), log:[]}; QS().fb = null;
  save(); render(); updateRail(); renderPanel();
  $('#quiz').classList.remove('show');
  toast(`${used.length} Räder eingetragen${timerDone ? ' + Timer-Rad' : ''}${skipped.length ? ' · übersprungen: ' + skipped.join(', ') : ''} · Session läuft`, 6000);
}

  if (d.qgo) { quizTab = d.qgo; renderQuiz(); $('#qBody').scrollTop = 0; return; }
  if (d.qsend) { const N = QS().names; sendText(quizProposal(d.qsend), 'SexRad-Vorschlag-' + N[d.qsend].replace(/[^\wäöüÄÖÜß-]+/g, '_') + '.txt'); return; }

// Joker: eigenes Video/Foto + Text zeigen, danach zugewiesenes Rad / Karte starten
/* Joker-Abfolgen: mehrere gespeicherte Abläufe (Rad/Karte × Anzahl) */
const SEQ = {run:false, abort:false};
function pickSeq(seqs) {
  return new Promise(res => {
    const box = $('#jpick');
    $('#jpickList').innerHTML = seqs.map((q, i) => `<button class="jbtn" data-pick="${i}">★ ${esc(q.name)}<small>${q.steps.map(st => stepName(st)).join(' → ')}</small></button>`).join('');
    box.classList.add('show');
    const fin = v => { box.classList.remove('show'); box.onclick = null; res(v); };
    box.onclick = e => { const b = e.target.closest('[data-pick]'); if (b) fin(seqs[+b.dataset.pick]); else if (e.target.id === 'jpickX' || e.target === box) fin(null); };
  });
}
function stepName(st) {
  const c = st.t[0] === 'c' ? S.presets.find(x => x.id === st.t.slice(1)) : null;
  const name = c ? 'Karte ' + c.name : (S.wheels[+st.t.slice(1)] || {}).title || '?';
  return esc(name) + (st.n > 1 ? ' ×' + st.n : '');
}
async function runSeq(q) {
  if (busy || SEQ.run) return;
  SEQ.run = true; SEQ.abort = false;
  const total = q.steps.reduce((a, st) => a + st.n, 0); let k = 0;
  try {
    for (const st of q.steps) for (let i = 0; i < st.n; i++) {
      if (SEQ.abort) return;
      k++; toast(`${q.name}: ${k} / ${total}`, 1600);
      if (st.t[0] === 'c') await runCard(st.t.slice(1), 0); else await doSpin(+st.t.slice(1), 0);
      await sleep(350);
    }
  } finally { SEQ.run = false; }
  if (!SEQ.abort) toast(`Abfolge „${q.name}“ fertig`); else toast('Abfolge gestoppt');
}
$('#bJoker').onclick = async () => {
  if (busy || SEQ.run) return;
  const seqs = S.joker.seqs.filter(q => q.steps.length);
  let seq = null;
  if (seqs.length === 1) seq = seqs[0];
  else if (seqs.length > 1) { seq = await pickSeq(seqs); if (!seq) return; }
  busy = true; ac(); setBusy(true); closePanel();
  SEQ.run = !!seq;   // Stopp-Button schon beim Joker-Intro zeigen
  const next = await showResult({unit:'', title:'Joker'}, 0, 0, Object.assign({}, S.joker, seq ? {next:-1, card:null} : {}));
  SEQ.run = false; busy = false; setBusy(false); render();
  if (seq) { if (!SEQ.abort) await runSeq(seq); SEQ.abort = false; }
  else if (next) await runNext(next, 1);
};

const APP_BUILD = 2026110104;

function buildTxt(b) { b = String(b || ''); return b.length >= 10 ? b.slice(6, 8) + '.' + b.slice(4, 6) + '.' + b.slice(0, 4) + ' (' + (+b.slice(8)) + ')' : (b || '–'); }
function updShowVer() {
  const ov = updNative() && AndroidApp.updateInstalled ? +AndroidApp.updateInstalled() || 0 : 0;
  $('#updVer').textContent = 'Installiert: Version ' + buildTxt(APP_BUILD) + (ov ? ' · per Update geladen' : '');

function updResult(r) {
  UPD.busy = false;

  if (!r || r.error) {
    UPD.remote = null; go.style.display = 'none'; notes.style.display = 'none';

    notes.textContent = r.notes || ''; notes.style.display = r.notes ? 'block' : 'none';
    go.style.display = ''; go.textContent = updNative() ? 'Jetzt laden' : 'Neu laden';
  } else {
    msg.textContent = 'Du hast schon die neueste Version.';

  }
}
window.__update = json => { let r = null; try { r = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { r = {error: 'Antwort ungültig'}; }
  if (r && r.installed) { $('#updMsg').textContent = 'Update geladen – die App startet neu …'; return; }
  updResult(r); };
async function updCheck(silent) {
  if (UPD.busy) return; UPD.busy = true;

}

   Pro:   zusätzlich Export/Import/Übermitteln, unbegrenzter Verlauf, Daten bleiben 12 Monate.
   Deinstallation löscht die App-Daten immer (macht Android selbst).
   ===================================================================== */
// Hauptschalter: Abo ist vorbereitet, aber noch AUS (siehe ZIELE.md). true = Abo aktiv.
const ABO_ACTIVE = false;
const LIC_KEY = 'sexrad.lic', DAY = 864e5;
const SUBS = {basis:'sexrad_basis', pro:'sexrad_pro'};
const KEEP = {basis:7 * DAY, pro:365 * DAY};
const OFFLINE_MAX = 30 * DAY;            // so lange darf das Abo ungeprüft bleiben (offline)
const BASIS_SESSIONS = 5;
const TESTMODE = !NATIVE || !!(NATIVE.testMode && NATIVE.testMode());
const licDefault = () => ({tier:'none', last:'none', seen:0, endAt:0, checked:0, src:'', renew:false});
let LIC; try { LIC = Object.assign(licDefault(), JSON.parse(localStorage.getItem(LIC_KEY))); } catch (e) { LIC = licDefault(); }
if (!ABO_ACTIVE) LIC = Object.assign(licDefault(), {tier:'pro', last:'pro', src:'off'});   // alles frei, nichts wird gelöscht
let BILL = {ready:false, known:false, products:[], subs:[], error:''};
let pwUpsell = false;
const isPro = () => LIC.tier === 'pro';
const hasSub = () => LIC.tier !== 'none';
const licStale = () => hasSub() && LIC.src === 'play' && Date.now() - LIC.checked > OFFLINE_MAX;
const licLocked = () => !hasSub() || licStale();
const licDeadline = () => LIC.endAt + (KEEP[LIC.last] || 0);
const licSave = () => { if (!ABO_ACTIVE) return; try { localStorage.setItem(LIC_KEY, JSON.stringify(LIC)); } catch (e) {} };
const fmtDate = t => new Date(t).toLocaleDateString('de-DE', {day:'numeric', month:'long', year:'numeric'});
const lockTag = () => isPro() ? '' : ' <span class="lock">PRO</span>';
const tierName = t => ({basis:'Basis', pro:'Pro', none:'kein Abo'})[t] || t;

function licSet(tier, src, renew) {
  const now = Date.now();
  LIC.src = src; LIC.checked = now;
  if (tier !== 'none') Object.assign(LIC, {tier, last:tier, seen:now, endAt:0, renew:!!renew});
  else { LIC.tier = 'none'; if (LIC.last !== 'none' && !LIC.endAt) LIC.endAt = now; }
  licSave(); licCheck();
}
async function wipeAll() {
  try { toyStop(); } catch (e) {}
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  try { if (DB.db) DB.db.close(); } catch (e) {}
  await new Promise(r => { try { const q = indexedDB.deleteDatabase('fickrad-media'); q.onsuccess = q.onerror = q.onblocked = () => r(); } catch (e) { r(); } });
  Object.assign(LIC, {last:'none', seen:0, endAt:0}); licSave();
  location.reload();
}
function licTrim() {
  if (!isPro() && S.quiz.sessions.length > BASIS_SESSIONS) { S.quiz.sessions = S.quiz.sessions.slice(-BASIS_SESSIONS); save(); }
}
function licCheck() {
  if (!ABO_ACTIVE) { renderPanel(); return; }
  if (!hasSub() && LIC.last !== 'none' && LIC.endAt && Date.now() > licDeadline()) { wipeAll(); return; }
  if (hasSub()) licTrim();
  if (licLocked()) { pwUpsell = false; openPaywall(); }
  else if ($('#paywall').classList.contains('show') && !pwUpsell) closePaywall();
  else if ($('#paywall').classList.contains('show')) renderPaywall();
  renderPanel();
}
// Antwort der Android-App (Google Play Billing)
window.__billing = s => {
  if (!ABO_ACTIVE) return;
  try { Object.assign(BILL, typeof s === 'string' ? JSON.parse(s) : s); } catch (e) { return; }
  if (BILL.known) {
    const act = BILL.subs.filter(x => !x.pending), ids = act.map(x => x.product);
    licSet(ids.includes(SUBS.pro) ? 'pro' : ids.includes(SUBS.basis) ? 'basis' : 'none', 'play', act.some(x => x.autoRenew));
  } else if ($('#paywall').classList.contains('show')) renderPaywall();
  if (BILL.event === 'cancel') toast('Kauf abgebrochen');
  if (BILL.event === 'pending') toast('Zahlung wird noch bearbeitet …', 4000);
  if (BILL.event === 'error' && BILL.error) toast('Google Play: ' + BILL.error, 4500);
  BILL.event = '';
};
function needPro() {
  if (isPro()) return false;
  toast('Export, Import und Übermitteln gibt es mit SexRad Pro', 3500);

}

const ISO_P = {D:['Tag', 'Tage'], W:['Woche', 'Wochen'], M:['Monat', 'Monate'], Y:['Jahr', 'Jahre']};
function isoPeriod(p) { const m = /^P(\d+)([DWMY])$/.exec(p || ''); if (!m) return ''; const n = +m[1]; return n + ' ' + ISO_P[m[2]][n === 1 ? 0 : 1]; }
function planBtn(prod, plan) {
  const plans = (BILL.products.find(x => x.id === SUBS[prod]) || {}).plans || [], o = plans.find(x => x.plan === plan);

  if (o && o.trial) sub += ' · ' + isoPeriod(o.trial) + ' gratis testen';
  return `<button class="pwbuy ${plan === 'jahr' ? '' : 'alt'}" data-buy="${prod}:${plan}">${label}<small>${esc(sub)}</small></button>`;
}
function renderPaywall() {

    <div class="pwgrid">
      <div class="pwcard ${LIC.tier === 'basis' ? 'cur' : ''}"><h2>Basis</h2><ul>
        ${li(1, 'Alle Räder, Karten, Joker, Timer und Spielzeug-Steuerung')}

        ${li(1, 'Fortschritt wird gespeichert – nur in der App auf diesem Gerät')}

      <div class="pwcard pro ${LIC.tier === 'pro' ? 'cur' : ''}"><h2>Pro ⭐</h2><ul>
        ${li(1, 'Alles aus Basis')}
        ${li(1, 'Export als Datei und Voll-ZIP mit allen Videos, Import')}
        ${li(1, 'Karten und Kombinationen an den Partner übermitteln')}
        ${li(1, 'Unbegrenzter Session-Verlauf, der Algorithmus lernt aus allem')}
        ${li(1, 'Daten bleiben nach Abo-Ende 12 Monate erhalten und lassen sich sichern')}</ul>
        ${planBtn('pro', 'monat')}${planBtn('pro', 'jahr')}</div>
    </div>
    <div class="pwfoot">Bei Deinstallation löscht Android alle Daten der App sofort – Pro-Nutzer sichern vorher per Export.<br>
      ${NATIVE && !TESTMODE ? '<button class="qbtn alt" data-pwx="restore">Käufe wiederherstellen</button><button class="qbtn alt" data-pwx="manage">Abo verwalten / kündigen</button>' : ''}
      ${TESTMODE ? `<div class="pwtest">Testmodus (${NATIVE ? 'Test-App' : 'Browser-Version'}) – Abo simulieren:
        <button class="qbtn alt" data-pwt="basis">Basis</button><button class="qbtn alt" data-pwt="pro">Pro</button>
        <button class="qbtn alt" data-pwt="none">Abgelaufen</button><button class="qbtn alt" data-pwt="ff">⏩ Löschfrist vorspulen</button></div>` : ''}</div>`;
}
$('#paywall').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
